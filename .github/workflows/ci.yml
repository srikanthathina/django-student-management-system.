name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sms_user
          POSTGRES_PASSWORD: sms_password
          POSTGRES_DB: sms_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sms_user -d sms_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sms_user:sms_password@localhost:5432/sms_db
      SECRET_KEY: ci-only-secret
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fail if model changes have no migration
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests on PostgreSQL
        run: python manage.py test -v 2
